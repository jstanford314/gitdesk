name: Build GitDesk

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re-)publish installers to, e.g. v0.1.1. Leave empty to just build without publishing.'
        required: false
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist-script: dist:mac
          - os: windows-latest
            dist-script: dist:win
          - os: ubuntu-latest
            dist-script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run ${{ matrix.dist-script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gitdesk-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # softprops/action-gh-release proved flaky uploading ~10 large binaries at
      # once ("Error saving asset" / "Error creating asset temp dir"), so publish
      # with the GitHub CLI instead, which is preinstalled on GitHub-hosted runners.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" artifacts/*/* --title "$TAG" --generate-notes --repo "${{ github.repository }}"
          fi
