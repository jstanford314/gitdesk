name: Build GitDesk

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re-)publish installers to, e.g. v0.1.1. Leave empty to just build without publishing.'
        required: false
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist-script: dist:mac
          - os: windows-latest
            dist-script: dist:win
          - os: ubuntu-latest
            dist-script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # electron-builder names its output files after package.json's version
      # field, which is easy to forget to bump by hand before cutting a
      # release. Derive it from the release tag instead so the built asset
      # filenames always match the tag, with no manual step to forget.
      - name: Set package version from release tag
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run ${{ matrix.dist-script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gitdesk-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # GitHub's own release-assets upload endpoint has proven flaky under this
      # batch of ~10 large binaries: softprops/action-gh-release failed twice
      # with vague errors, and the gh CLI's own bulk upload (all files in one
      # invocation) then hit a clean "HTTP 500: Error creating asset temp dir"
      # from uploads.github.com on one specific file. Upload strictly one file
      # at a time with per-file retries so a transient 500 on any single asset
      # doesn't take the whole release down.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes --repo "${{ github.repository }}"
          fi

          find artifacts -type f | sort | while read -r file; do
            echo "Uploading $file..."
            success=false
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$file" --clobber --repo "${{ github.repository }}"; then
                success=true
                break
              fi
              echo "Attempt $attempt failed, retrying in 8s..."
              sleep 8
            done
            if [ "$success" != "true" ]; then
              echo "::error::Failed to upload $file after 5 attempts"
              exit 1
            fi
          done
